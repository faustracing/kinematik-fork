[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsae-workbench"
version = "0.1.0"
description = "Tire-first FSAE suspension kinematics workbench over the Suspension Explorer solver"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Faust Racing" }]
keywords = ["fsae", "suspension", "kinematics", "vehicle-dynamics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=2.2.0",
  "scipy>=1.14.1",
  "pydantic>=2.9",
]

# The constraint solver. This is a hard runtime dependency of workbench.solve,
# but it cannot be resolved from an index yet: suspension-explorer-core is not
# published to PyPI and has no stable public git ref we can pin. Until it does,
# install it from a local checkout (see README "Solver dependency") and keep the
# dependency declared as an extra so a bare `pip install -e .` still succeeds.
#
# TODO(solver-pin): when the repository is reachable, delete this extra and add
#   kinematics @ git+https://github.com/faustracing/suspension-explorer-core@v0.10.0
# to [project.dependencies], then drop the importorskip guards in tests.
[project.optional-dependencies]
solver = ["kinematics>=0.10.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["workbench"]

[tool.uv.sources]
# Local editable solver checkout for day-to-day development. uv only; pip users
# run the explicit install documented in the README.
kinematics = { path = "../se-fork", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["workbench", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # import sorting
  "UP",            # pyupgrade
  "B",             # bugbear
  "D",             # pydocstyle
  "N",             # pep8-naming
  "RUF",
]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "solver: requires the `kinematics` solver package to be installed",
  "golden: pins numeric golden values for the reference car",
]
